<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary meta -->
    <title>Northline — Quality Essentials</title>
    <meta name="description" content="Northline — quality essentials curated for modern living. Shop electronics, home goods, fashion and more." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Northline" />

    <!-- Favicon + PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#10b981" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Northline" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Northline" />
    <meta property="og:title" content="Northline — Quality Essentials" />
    <meta property="og:description" content="Curated products for modern living. Fast shipping, easy returns, secure checkout." />
    <meta property="og:url" content="https://northline.store" />
    <meta property="og:image" content="https://northline.store/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Northline — Quality Essentials" />
    <meta name="twitter:description" content="Quality essentials curated for modern living." />
    <meta name="twitter:image" content="https://northline.store/og-image.png" />

    <!-- Performance hints -->
    <link rel="dns-prefetch" href="https://api.stripe.com" />
    <link rel="preconnect" href="https://api.stripe.com" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding:2rem;text-align:center;font-family:sans-serif">
        Northline requires JavaScript to run. Please enable it in your browser settings.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
